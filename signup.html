<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Product Inventory System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="container">
            <div class="logo">Inventory System</div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Sign Up Form -->
            <div class="auth-form signup-form" id="signupForm">
                <h2>Create Account</h2>
                <form id="signupFormElement">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Enter a password (min 6 characters)" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn-submit">Sign Up</button>
                    <p class="toggle-text">Already have an account? <a href="login.html">Login</a></p>
                </form>
                <div id="signupError" class="error-message"></div>
            </div>
        </div>
    </div>

    <footer>
    <p>&copy; 2026 Inventory System. All rights reserved.</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="auth.js"></script>

</html>
