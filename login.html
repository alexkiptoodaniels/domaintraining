<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Product Inventory System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="container">
            <div class="logo">Inventory System</div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle">☀️ Light Mode</button>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Login Form -->
            <div class="auth-form login-form" id="loginForm">
                <h2>Login</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-submit">Login</button>
                    <p class="toggle-text">Don't have an account? <a href="signup.html">Sign up</a></p>
                </form>
                <div id="loginError" class="error-message"></div>
            </div>
        </div>
    </div>

    <footer>
    <p>&copy; 2026 Inventory System. All rights reserved.</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="auth.js"></script>

</html>
